name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # 调用点单一源(F206): typecheck/lint 委托 package.json scripts, 防 CI 与本地参数漂移
      - run: npm run build
      - run: npm run lint:ci
      - run: npm run check:alias
      - run: npm run check:test-liveness
      - run: npm run check:node
      - run: npm run check:engine-strict
      # --runInBand: 顺序执行防并行 act() 资源争抢假红 (F399 同族 F457, 2026-10-25 本地复现: 并行 1/646 fail, 顺序 59套/646 全绿)
      - run: npm test -- --runInBand --coverage --ci --reporters=default
      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          retention-days: 7

  export:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx expo export --platform android
      - run: npx expo export --platform ios
