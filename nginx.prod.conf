# ─── 天链V3 生产 Nginx 统一入口配置 (增强版) ───
# 支持: HTTP/2, HTTPS, 静态资源缓存, Gzip/Brotli, 安全头, CORS

# ─── Upstream 定义 ───
upstream backend {
    server backend:8000 max_fails=3 fail_timeout=30s;
    keepalive 32;
}

upstream frontend {
    server frontend:80 max_fails=3 fail_timeout=30s;
    keepalive 32;
}

# ─── HTTP → HTTPS 重定向 ───
# 注释掉 301 跳转即可转为纯 HTTP 模式（内网/开发环境）
server {
    listen 80;
    server_name _;

    # Let's Encrypt ACME challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # 其他请求重定向到 HTTPS
    # 内网部署时可注释下面三行，直接提供服务
    location / {
        return 301 https://$host$request_uri;
    }
}

# ─── 纯 HTTP 模式 (可选，取消注释以替代 HTTPS) ───
# server {
#     listen 80;
#     server_name _;
#
#     access_log /var/log/nginx/tianlian-access.log tianlian;
#     error_log /var/log/nginx/tianlian-error.log warn;
#
#     include /etc/nginx/conf.d/shared-proxy.conf;
# }

# ─── HTTPS 主服务 ───
server {
    listen 443 ssl http2;
    server_name _;

    # ─── SSL 证书 (由 certbot 管理) ───
    ssl_certificate /etc/letsencrypt/live/tianlian.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tianlian.example.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # ─── 安全头 ───
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

    # ─── 日志 ───
    log_format tianlian '$remote_addr - $remote_user [$time_local] '
                        '"$request" $status $body_bytes_sent '
                        '"$http_referer" "$http_user_agent" '
                        'request_id=$request_id rt=$request_time';
    access_log /var/log/nginx/tianlian-access.log tianlian;
    error_log /var/log/nginx/tianlian-error.log warn;

    client_max_body_size 20M;
    client_body_timeout 30s;
    client_header_timeout 10s;

    # ─── Gzip 压缩 ───
    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/json
        application/xml
        application/rss+xml
        image/svg+xml
        font/woff2;

    # ─── 速率限制 ───
    limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;
    limit_req_zone $binary_remote_addr zone=login:10m rate=5r/m;

    # ─── API 代理到后端 ───
    location /api/ {
        limit_req zone=api burst=50 nodelay;

        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
        proxy_set_header Connection "";

        # 超时配置
        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        # 缓冲
        proxy_buffering on;
        proxy_buffer_size 4k;
        proxy_buffers 8 16k;
        proxy_busy_buffers_size 32k;

        # 禁止缓存 API 响应
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header Pragma "no-cache" always;
    }

    # WebSocket 代理
    location /ws/ {
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # ─── 登录接口限流 ───
    location /api/v1/login {
        limit_req zone=login burst=5 nodelay;
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ─── 前端静态文件 ───
    # JS/CSS 文件 - 长期缓存 (带 hash 的文件名)
    location ~* \.(js|css)$ {
        proxy_pass http://frontend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header Vary "Accept-Encoding";
    }

    # 字体文件 - 长期缓存
    location ~* \.(woff2?|ttf|eot|otf)$ {
        proxy_pass http://frontend;
        proxy_set_header Host $host;

        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header Access-Control-Allow-Origin "*";
    }

    # 图片文件 - 中期缓存
    location ~* \.(png|jpg|jpeg|gif|svg|ico|webp)$ {
        proxy_pass http://frontend;
        proxy_set_header Host $host;

        expires 30d;
        add_header Cache-Control "public";
    }

    # 前端 SPA 路由 - 其余所有路径
    location / {
        proxy_pass http://frontend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Request-ID $request_id;

        # 禁止缓存 HTML (SPA fallback)
        add_header Cache-Control "no-cache, must-revalidate" always;
        add_header Pragma "no-cache" always;
        expires 0;
    }

    # ─── Let's Encrypt ACME challenge (HTTPS 也需要) ───
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # ─── Prometheus metrics ───
    location /metrics {
        proxy_pass http://backend:8000/metrics;
        proxy_set_header Host $host;
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        deny all;
        access_log off;
    }

    # ─── 健康检查 ───
    location /health {
        access_log off;
        return 200 'OK';
        add_header Content-Type text/plain;
    }

    # ─── 禁止访问隐藏文件 ───
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}