[pytest]
asyncio_mode = auto
testpaths = tests
# OOM 根因：单进程跑全量（3248 测试）时，每测试 function-scope fixture 创建新
# SQLAlchemy engine + session + FastAPI TestClient，RSS 线性累积 ~2.5MB/测试 →
# 峰值 ~8GB，8GB 机器被 SIGKILL（gc.collect 实测无效，对象有活跃引用回收不掉）。
# 解法：pytest-xdist 多 worker 进程，每个 worker 跑完即退出、内存彻底释放。
# -n 4 --dist=loadfile：4 worker 文件级分发（同文件同 worker，保留文件内顺序，
# 减少 session/schema fixture 重建），4 并发峰值 ~3GB 安全。单进程调试用 pytest -n 0。
#
# --timeout=120 --timeout-method=signal (pytest-timeout)：单测试 120s 上限。
# 根因 (卡 a34be736)：曾出现「全量 pytest 超过 3 分钟无输出疑似卡死」，根因是 (a) 旧
# 残留 pytest 进程占满 CPU 拖慢新进程 + (b) 配置里没有任何 timeout，一旦某测试/worker
# 阻塞在 IO/锁/event loop 就无限挂起、零输出。加全局 timeout 后，阻塞测试会被 SIGALRM
# 打断并标记 FAIL（而非静默 hang），保证 run 一定收敛、有产出。signal 法对纯 Python
# 阻塞有效；极少数 C 层死锁（线程 join/socket）signal 无法打断时，由测试本身修复。
# 单进程 (-n 0) 调试时同样生效。
addopts = -m "not slow" -n 4 --dist=loadfile --timeout=120 --timeout-method=signal
filterwarnings =
    ignore::DeprecationWarning
markers =
    slow: marks tests as slow (deselect with: -m "not slow")
    integration: marks tests as integration tests
    unit: marks tests as unit tests
