# ─── 天链V3 HTTPS Nginx 配置 ───
# 使用方法: 先运行 scripts/ssl-setup.sh 申请证书, 然后部署此配置文件
# 拓扑对齐生产 systemd nginx (sites-enabled/tianlian):
#   后端 = upstream backend 127.0.0.1:8080, 前端 = root 静态 /opt/tianlian-cloud/frontend/dist

# ── 后端 upstream (生产 systemd 拓扑) ──
upstream backend {
    server 127.0.0.1:8080;
    keepalive 32;
}

# ── HTTP → HTTPS 重定向 ──
server {
    listen 80;
    listen [::]:80;
    server_name ${DOMAIN};

    # Let's Encrypt ACME challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # 其余全部重定向到 HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# ── HTTPS 主服务 ──
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name ${DOMAIN};

    # ── SSL 证书 ──
    ssl_certificate     /etc/letsencrypt/live/${DOMAIN}/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/${DOMAIN}/privkey.pem;

    # ── SSL 安全配置 ──
    ssl_protocols TLSv1.2 TLSv1.3;                    # 禁用旧协议
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;                     # 让客户端选择最优加密算法

    # ── SSL 会话缓存 ──
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    ssl_session_tickets off;

    # ── OCSP Stapling ──
    ssl_stapling on;
    ssl_stapling_verify on;
    resolver 8.8.8.8 8.8.4.4 valid=300s;
    resolver_timeout 5s;

    # ── HSTS (HTTP Strict Transport Security) ──
    # 强制浏览器只使用 HTTPS 访问, 防止降级攻击
    # max-age=63072000=2年, includeSubDomains, preload
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

    # ── 其他安全头 ──
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Permitted-Cross-Domain-Policies "none" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # ── 日志 ──
    access_log /var/log/nginx/tianlian-ssl-access.log;
    error_log  /var/log/nginx/tianlian-ssl-error.log;

    log_format tianlian '$remote_addr - $remote_user [$time_local] '
                        '"$request" $status $body_bytes_sent '
                        '"$http_referer" "$http_user_agent" '
                        'request_id=$request_id';

    client_max_body_size 10M;

    # ── Gzip 压缩 ──
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript
               application/javascript application/json application/xml
               image/svg+xml font/woff2;

    # ── API 代理 ──
    location /api/ {
        proxy_pass http://backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
    }

    # ── WebSocket 代理 ──
    location /ws/ {
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
    }

    # ── 前端 SPA (静态文件, 与生产 sites-enabled/tianlian 一致) ──
    root /opt/tianlian-cloud/frontend/dist;

    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location / {
        # SPA 路由回退: 未命中的路径返回 index.html
        try_files $uri $uri/ /index.html;
    }
}