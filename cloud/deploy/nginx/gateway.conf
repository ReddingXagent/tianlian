# 天链 V2 API 网关 — 多Pod路由配置
# 根据 X-Region-ID header 路由到对应 Pod
# 
# Phase 2: 矩阵路由层
# 
# 部署位置: /etc/nginx/sites-available/tianlian-gateway
# 启用方式: ln -s /etc/nginx/sites-available/tianlian-gateway /etc/nginx/sites-enabled/

# ─── Upstream 定义 ───

# 默认区域 Pod
upstream pod-default {
    server demo.example.com:8000 max_fails=3 fail_timeout=30s;
    keepalive 32;  # 保持连接池
}

# 华南区域 Pod (示例)
upstream pod-south {
    # 主 Pod
    server 10.0.1.1:8000 max_fails=3 fail_timeout=30s;
    # 备用 Pod (可选)
    server 10.0.1.2:8000 max_fails=3 fail_timeout=30s backup;
    keepalive 32;
}

# 华东区域 Pod (示例)
upstream pod-east {
    server 10.0.2.1:8000 max_fails=3 fail_timeout=30s;
    keepalive 32;
}

# 华北区域 Pod (示例)
upstream pod-north {
    server 10.0.3.1:8000 max_fails=3 fail_timeout=30s;
    keepalive 32;
}

# ─── 主服务器 ───

server {
    listen 80;
    server_name api.tianlian.com;
    
    # 安全头
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-XSS-Protection "1; mode=block" always;
    
    # 日志格式（包含 region_id）
    log_format tianlian '$remote_addr - $remote_user [$time_local] '
                         '"$request" $status $body_bytes_sent '
                         '"$http_referer" "$http_user_agent" '
                         'region=$http_x_region_id pod=$upstream_addr';
    
    access_log /var/log/nginx/tianlian-access.log tianlian;
    error_log /var/log/nginx/tianlian-error.log;
    
    # ─── API 路由 ───
    
    location /api/v1/ {
        # 根据 X-Region-ID header 路由
        set $backend "pod-default";
        
        # 华南区域
        if ($http_x_region_id = "south-china") {
            set $backend "pod-south";
        }
        
        # 华东区域
        if ($http_x_region_id = "east-china") {
            set $backend "pod-east";
        }
        
        # 华北区域
        if ($http_x_region_id = "north-china") {
            set $backend "pod-north";
        }
        
        # 代理配置
        proxy_pass http://$backend;
        proxy_http_version 1.1;
        
        # 透传 headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Region-ID $http_x_region_id;
        proxy_set_header X-Pod-ID $upstream_addr;
        
        # 连接复用
        proxy_set_header Connection "";
        
        # 超时配置
        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        
        # 缓冲配置
        proxy_buffering on;
        proxy_buffer_size 4k;
        proxy_buffers 8 16k;
    }
    
    # ─── WebSocket 路由 ───
    
    location /ws/v1/ {
        # WebSocket 使用相同路由规则
        set $backend "pod-default";
        
        if ($http_x_region_id = "south-china") {
            set $backend "pod-south";
        }
        if ($http_x_region_id = "east-china") {
            set $backend "pod-east";
        }
        if ($http_x_region_id = "north-china") {
            set $backend "pod-north";
        }
        
        proxy_pass http://$backend;
        proxy_http_version 1.1;
        
        # WebSocket 必需 headers
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Region-ID $http_x_region_id;
        
        # WebSocket 超时（长连接）
        proxy_connect_timeout 60s;
        proxy_send_timeout 3600s;
        proxy_read_timeout 3600s;
    }
    
    # ─── 内部跨 Pod 通信 ───
    
    location /internal/ {
        # 仅允许内网访问
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        deny all;
        
        # 内部通信走默认 Pod
        proxy_pass http://pod-default;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        
        # 内部通信超时较短
        proxy_connect_timeout 5s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }
    
    # ─── 健康检查 ───
    
    location /health {
        return 200 'OK';
        add_header Content-Type text/plain;
    }
    
    # ─── 根路径 ───
    
    location / {
        return 301 /api/v1/;
    }
}

