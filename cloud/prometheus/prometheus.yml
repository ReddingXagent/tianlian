# ─── Prometheus 配置文件 ───
# 天链V3 监控指标采集

global:
  scrape_interval: 15s      # 抓取间隔
  scrape_timeout: 10s       # 抓取超时
  evaluation_interval: 15s  # 规则评估间隔

# 告警规则文件
rule_files:
  - "alerts.yml"

# Alertmanager 配置
alerting:
  alertmanagers:
    - static_configs:
        - targets:
          - "alertmanager:9093"

scrape_configs:

  # ============ 天链V3 后端服务 ============
  - job_name: "tianlian-backend"
    metrics_path: "/metrics"
    scrape_interval: 15s
    static_configs:
      - targets:
          # 后端服务地址（裸机生产，deploy.sh BACKEND_PORT=8080）
          - "localhost:8080"
        labels:
          service: "tianlian-v3"
          component: "backend"
          env: "production"

  # ============ Prometheus 自监控 ============
  - job_name: "prometheus"
    scrape_interval: 30s
    static_configs:
      - targets:
          - "localhost:9090"
        labels:
          service: "prometheus"
          component: "monitoring"