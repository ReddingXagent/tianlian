# ========== 部署检查清单 ==========
# 1. ✅ 确认Nginx配置语法: nginx -t
# 2. ✅ 重启Nginx服务: nginx -s reload
# 3. ✅ 验证WebSocket连接: curl -i -N -H "Connection: Upgrade" -H "Upgrade: websocket" -H "Sec-WebSocket-Key: test" -H "Sec-WebSocket-Version: 13" http://localhost/ws/v1/dashboard
# 4. ✅ 监控连接数: nginx_status 或 logs
# 5. ✅ 测试前端连接: 打开Dashboard页面,检查WebSocket连接状态

