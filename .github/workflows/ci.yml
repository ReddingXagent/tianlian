# 天链V3 边缘网关 — GitHub Actions CI
# 触发: push(main) + PR
# 阶段: lint → test(cov) ‖ docker镜像构建+import smoke
# 运行时: Python 3.10 (匹配Pi生产环境)

name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint + Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Ruff lint
        run: ruff check . --output-format=github

      - name: Compile check
        run: python -m compileall main.py config.py adapters/ api/ models/ storage/ -q

      - name: Pytest with coverage
        run: |
          pip install pytest-cov
          pytest -x -q --timeout=30 --cov=. --cov-report=term-missing --cov-report=xml

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml
          retention-days: 7

  docker:
    name: Docker image build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 只构建不推送：验证 Dockerfile/依赖可成功成镜像（GHA缓存加速）
      - name: Build image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: tianlian-edge-gateway:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # 冒烟: 容器内无环境变量纯 import（main.py 有 __main__ 守卫，不启服务）
      - name: Smoke test (import in container)
        run: docker run --rm tianlian-edge-gateway:ci python3 -c "import main"
