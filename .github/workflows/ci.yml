name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # 调用点单一源(F206): typecheck/test/doctor 均委托 package.json scripts, 防 CI 与本地参数漂移
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test -- --coverage --ci --reporters=default
      - run: npm run doctor

  export:
    runs-on: ubuntu-latest
    needs: check
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # 调用点单一源(F212/F206): export 同样委托 package.json scripts(build:android/build:ios), 参数透传
      - run: npm run build:android -- --output-dir /tmp/export
      - run: npm run build:ios -- --output-dir /tmp/export-ios
      - run: ./scripts/bundle-size.sh /tmp/export /tmp/export-ios
      # 产物留档: bundle-size回归/导出异常时可下载hbc与资产排查 (always: 门控失败也要能取证)
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: expo-export-bundles
          path: |
            /tmp/export
            /tmp/export-ios
          retention-days: 7
