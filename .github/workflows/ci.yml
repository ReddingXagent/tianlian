name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run check:auth-keys
      - run: npm run check:dead-handlers
      - run: npm run check:nav-targets
      - run: npm run check:orphan-components
      - run: npm run check:orphan-pages
      - run: npm run check:permission-apis
      - run: npm run check:request-source
      - run: npm run check:storage-keys
      - run: npm run check:wxml-handlers
      - run: npm test -- --coverage --passWithNoTests

  structure:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: node scripts/check-mp-structure.js
