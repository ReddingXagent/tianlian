# ═══════════════════════════════════════════════════════════════
#  天链V3 - CI/CD Pipeline
# ═══════════════════════════════════════════════════════════════
# 触发条件:
#   - main 分支 push
#   - PR 到 main
#   - 手动触发 (workflow_dispatch)
#
# 阶段:
#   1. Lint + TypeCheck (前端)
#   2. 前端单元测试 (Vitest)
#   3. 前端构建 (Vite)
#   4. 后端 Lint + 测试 (Pytest)
#   5. Docker 构建
#   6. (可选) 部署到服务器
# ═══════════════════════════════════════════════════════════════

name: 天链V3 CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      deploy:
        description: "部署到生产环境"
        type: boolean
        required: true
        default: false

env:
  NODE_VERSION: "20"
  PYTHON_VERSION: "3.11"

jobs:
  # ─── 前端: Lint + TypeCheck ───
  frontend-lint:
    name: 前端 Lint & TypeCheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: 设置 Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: 安装依赖
        run: npm ci

      - name: TypeScript 类型检查
        run: npx tsc --noEmit
        continue-on-error: true # 允许类型错误不阻断

      - name: ESLint
        run: npm run lint
        continue-on-error: true

  # ─── 前端: 单元测试 (Vitest) ───
  frontend-test:
    name: 前端单元测试
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: 设置 Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: 安装依赖
        run: npm ci

      - name: Vitest 单元测试
        run: npm run test:unit

      - name: 上传覆盖率报告
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frontend-coverage
          path: frontend/coverage/
          retention-days: 7

  # ─── 前端: 构建 ───
  frontend-build:
    name: 前端构建
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: 设置 Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: 安装依赖
        run: npm ci

      - name: Vite 生产构建
        run: npm run build
        env:
          NODE_ENV: production

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/
          retention-days: 7

  # ─── 后端: Lint + 测试 ───
  backend-test:
    name: 后端 Lint & 测试
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: 设置 Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Flake8 Lint
        run: |
          pip install flake8
          flake8 app --count --statistics
        continue-on-error: true

      - name: Pytest 测试
        run: |
          pip install pytest pytest-asyncio pytest-cov httpx-ws
          python -m pytest tests/ -v --tb=short --cov=app --cov-report=term --cov-report=xml
        continue-on-error: true

      - name: 上传覆盖率报告
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-coverage
          path: backend/coverage.xml
          retention-days: 7

  # ─── Docker 镜像构建 ───
  docker-build:
    name: Docker 镜像构建
    runs-on: ubuntu-latest
    needs: [frontend-test, frontend-build]

    steps:
      - uses: actions/checkout@v4

      - name: 下载前端构建产物
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist

      - name: 设置 Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 登录 Docker Hub (可选)
        uses: docker/login-action@v3
        if: github.ref == 'refs/heads/main'
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # 构建前端镜像
      - name: 构建前端 Docker 镜像
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: ${{ github.ref == 'refs/heads/main' }}
          tags: |
            tianlian/frontend:latest
            tianlian/frontend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # 构建后端镜像
      - name: 构建后端 Docker 镜像
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: ${{ github.ref == 'refs/heads/main' }}
          tags: |
            tianlian/backend:latest
            tianlian/backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ─── 部署 (仅 main 分支 + deploy=true) ───
  deploy:
    name: 部署到生产服务器
    runs-on: ubuntu-latest
    needs: [docker-build]
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event.inputs.deploy == 'true')
    environment: production

    steps:
      - uses: actions/checkout@v4

      - name: 配置 SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          echo "${{ secrets.DEPLOY_HOST_KEY }}" >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: 部署到服务器
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no \
            ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} << 'EOF'
            cd /opt/tianlian-v3
            git pull origin main
            docker compose -f docker-compose.yml --env-file docker/.env pull
            docker compose -f docker-compose.yml --env-file docker/.env up -d --remove-orphans
            docker image prune -f
            echo "✅ 部署完成, $(date)"
          EOF

      - name: 健康检查
        run: |
          sleep 30
          curl -f http://${{ secrets.DEPLOY_HOST }}/api/v1/health && echo "✅ 健康检查通过" || echo "⚠️ 健康检查失败, 请手动确认"