name: Changelog 自动生成

on:
  push:
    branches: [stable-v3.0, main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      mode:
        description: '生成模式'
        required: true
        default: 'full'
        type: choice
        options:
          - full
          - latest

permissions:
  contents: write

jobs:
  generate-changelog:
    name: 生成 Changelog
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # 需要完整历史来生成 changelog

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 生成 Changelog
        run: |
          if [ "${{ github.event.inputs.mode }}" = "latest" ]; then
            python3 scripts/generate-changelog.py --latest
          else
            python3 scripts/generate-changelog.py
          fi

      - name: 显示 Changelog 内容
        run: |
          echo "📋 生成的 CHANGELOG.md:"
          head -60 CHANGELOG.md

      - name: 提交 Changelog 更新
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "docs: 自动更新 CHANGELOG.md"
          file_pattern: CHANGELOG.md
          commit_author: "大圣 <dasheng@tianlian.cloud>"

      - name: 上传 Changelog 产物
        uses: actions/upload-artifact@v4
        with:
          name: changelog
          path: CHANGELOG.md
          retention-days: 30