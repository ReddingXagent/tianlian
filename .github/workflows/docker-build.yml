# 天链V3 - Docker 镜像构建 & 自动发布
# 推送主分支或标签时自动构建并发布镜像

name: Docker Build & Push

on:
  push:
    branches: [main, master, stable-v3.0]
    tags: ['v*']
  pull_request:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      push:
        description: '是否推送到镜像仓库'
        required: false
        type: boolean
        default: false

env:
  REGISTRY: ghcr.io
  IMAGE_BACKEND: ${{ github.repository }}/tianlian-backend
  IMAGE_FRONTEND: ${{ github.repository }}/tianlian-frontend
  IMAGE_EDGE: ${{ github.repository }}/tianlian-edge-gateway

jobs:
  # ============ 构建前端镜像 ============
  build-frontend:
    name: Build Frontend Image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_FRONTEND }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix={{branch}}-

      - name: Log in to Container Registry
        if: github.event_name != 'pull_request' && (github.event.inputs.push == 'true' || github.event_name == 'push' && startsWith(github.ref, 'refs/tags/'))
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: ${{ github.event_name != 'pull_request' && (github.event.inputs.push == 'true' || startsWith(github.ref, 'refs/tags/v')) }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            NODE_ENV=production

  # ============ 构建后端镜像 ============
  build-backend:
    name: Build Backend Image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_BACKEND }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix={{branch}}-

      - name: Log in to Container Registry
        if: github.event_name != 'pull_request' && (github.event.inputs.push == 'true' || github.event_name == 'push' && startsWith(github.ref, 'refs/tags/'))
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: ${{ github.event_name != 'pull_request' && (github.event.inputs.push == 'true' || startsWith(github.ref, 'refs/tags/v')) }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ============ 构建边缘网关镜像 ============
  build-edge:
    name: Build Edge Gateway Image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_EDGE }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=sha,prefix={{branch}}-

      - name: Log in to Container Registry
        if: github.event_name != 'pull_request' && (github.event.inputs.push == 'true' || github.event_name == 'push' && startsWith(github.ref, 'refs/tags/'))
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ./edge-gateway
          file: ./edge-gateway/Dockerfile
          push: ${{ github.event_name != 'pull_request' && (github.event.inputs.push == 'true' || startsWith(github.ref, 'refs/tags/v')) }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ============ Docker Compose 集成测试 ============
  integration-test:
    name: Docker Compose Smoke Test
    runs-on: ubuntu-latest
    needs: [build-backend, build-frontend]
    if: github.event_name == 'pull_request'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Docker Compose
        run: |
          docker compose version

      - name: Start services
        run: |
          cp .env.dev .env.docker 2>/dev/null || true
          docker compose -f docker-compose.yml up -d db redis backend
          echo "Waiting for services to be healthy..."
          timeout 120 bash -c 'until curl -s http://localhost:8000/api/v1/health; do sleep 3; done'

      - name: Health check
        run: |
          curl -f http://localhost:8000/api/v1/health || (docker compose logs backend && exit 1)
          echo "Backend is healthy!"

      - name: Cleanup
        if: always()
        run: docker compose down -v

  # ============ 汇总 ============
  build-summary:
    name: Build Summary
    needs: [build-frontend, build-backend, build-edge]
    runs-on: ubuntu-latest
    if: always()

    steps:
      - name: Check results
        run: |
          echo "| Image | Status |" > summary.md
          echo "|-------|--------|" >> summary.md
          echo "| Frontend | ${{ needs.build-frontend.result }} |" >> summary.md
          echo "| Backend | ${{ needs.build-backend.result }} |" >> summary.md
          echo "| Edge Gateway | ${{ needs.build-edge.result }} |" >> summary.md
          cat summary.md >> $GITHUB_STEP_SUMMARY
