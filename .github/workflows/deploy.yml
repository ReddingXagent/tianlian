name: 天链V3 自动部署 (增强版)

on:
  push:
    branches: [stable-v3.0, feature/frontend-api-integration]
  pull_request:
    branches: [stable-v3.0]
  workflow_dispatch:
    inputs:
      target:
        description: '部署目标'
        required: true
        default: 'production'
        type: choice
        options:
          - production
          - staging
      skip_tests:
        description: '跳过测试'
        required: false
        default: false
        type: boolean

env:
  NODE_VERSION: '20'
  PYTHON_VERSION: '3.11'

jobs:
  # ============ 前端 Lint + TypeCheck + Build ============
  frontend-check:
    name: 前端检查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 设置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: 安装依赖
        run: |
          cd frontend
          npm ci

      - name: TypeScript 类型检查
        run: |
          cd frontend
          npx tsc --noEmit || echo '⚠️ TypeScript 检查有警告，继续构建'
        continue-on-error: true

      - name: 检查构建
        run: |
          cd frontend
          npm run build

  # ============ 前端单元测试 ============
  frontend-test:
    name: 前端测试
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 设置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: 安装依赖
        run: |
          cd frontend
          npm ci

      - name: 运行测试 + 覆盖率
        run: |
          cd frontend
          npm test -- --run --coverage

      - name: 上传覆盖率报告
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: frontend/coverage/

      - name: 上传 Playwright E2E 报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/test-results/

  # ============ 后端测试 ============
  backend-test:
    name: 后端测试
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: tianlian
          POSTGRES_PASSWORD: ${{ secrets.TIANLIAN_DB_PASSWORD }}
          POSTGRES_DB: tianlian_v3
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: 安装依赖
        run: |
          cd backend
          pip install -r requirements.txt

      - name: 运行测试
        env:
          DATABASE_URL: postgresql://tianlian:${{ secrets.TIANLIAN_DB_PASSWORD }}@localhost:5432/tianlian_v3
          REDIS_URL: redis://localhost:6379/0
          SECRET_KEY: ci-test-secret
        run: |
          cd backend
          pytest --cov=app --cov-report=term --cov-report=xml --cov-fail-under=40 -x -q

      - name: 上传覆盖率
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/coverage.xml

  # ============ Docker 构建 ============
  docker-build:
    name: Docker 构建
    runs-on: ubuntu-latest
    needs: [frontend-check]
    steps:
      - uses: actions/checkout@v4

      - name: 构建前端镜像
        run: |
          cd frontend
          docker build -t tianlian-frontend:latest .

      - name: 构建后端镜像
        run: |
          cd backend
          docker build -t tianlian-backend:latest .

      - name: 验证镜像
        run: |
          docker images | grep tianlian

  # ============ 部署到生产 ============
  deploy:
    name: 部署到云服务器
    needs: [frontend-test, backend-test, docker-build]
    if: github.ref == 'refs/heads/stable-v3.0' && github.event_name == 'push'
    runs-on: ubuntu-latest
    environment:
      name: production

    steps:
      - uses: actions/checkout@v4

      - name: 构建前端
        run: |
          cd frontend
          npm ci
          npm run build

      - name: 部署后端代码
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "backend/app/*"
          target: "/opt/tianlian-v3/"
          strip_components: 1

      - name: 部署前端构建产物
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "frontend/dist/*"
          target: "/opt/tianlian-v3/frontend/"
          strip_components: 1

      - name: 部署配置
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "docker-compose.yml,nginx.prod.conf,.env.prod"
          target: "/opt/tianlian-v3/"

      - name: 远程重启服务
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            cd /opt/tianlian-v3

            echo '📦 备份数据库...'
            cp backend/data/tianlian_v3.db backend/data/tianlian_v3.db.bak_$(date +%Y%m%d_%H%M%S) || true

            echo '🔄 拉取最新镜像...'
            docker compose --env-file .env.prod pull

            echo '🔨 重新构建 + 部署...'
            docker compose --env-file .env.prod up -d --build --remove-orphans

            echo '⏳ 等待健康检查...'
            sleep 30

            echo '🔍 健康检查...'
            curl -sf http://localhost/api/v1/health && echo '✅ 后端正常' || echo '❌ 后端异常'
            curl -sf http://localhost/ && echo '✅ 前端正常' || echo '❌ 前端异常'

            echo '🧹 清理旧镜像...'
            docker image prune -af --filter "until=72h" || true

            echo '✅ 部署完成！'
