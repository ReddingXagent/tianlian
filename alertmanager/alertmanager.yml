route:
  group_by: ['alertname', 'severity', 'component']
  group_wait: 10s
  group_interval: 2m
  repeat_interval: 4h
  receiver: 'default'
  routes:
    - match:
        severity: critical
      receiver: 'im-critical'
      repeat_interval: 1h
    - match:
        severity: warning
      receiver: 'im-warning'
      repeat_interval: 2h

receivers:
  - name: 'default'
    webhook_configs:
      - url: 'http://host.docker.internal:8000/api/v1/alert-webhook'
        send_resolved: true
        http_config:
          tls_config:
            insecure_skip_verify: true

  - name: 'im-critical'
    webhook_configs:
      - url: 'http://host.docker.internal:8000/api/v1/alert-webhook'
        send_resolved: true
        http_config:
          tls_config:
            insecure_skip_verify: true

  - name: 'im-warning'
    webhook_configs:
      - url: 'http://host.docker.internal:8000/api/v1/alert-webhook'
        send_resolved: true
        http_config:
          tls_config:
            insecure_skip_verify: true
